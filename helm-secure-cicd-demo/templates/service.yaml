apiVersion: v1
kind: Service

metadata:
  name: {{ include "secure-cicd-demo.fullname" . }}
  namespace: {{ .Release.Namespace }}

spec:
  type: {{ .Values.service.type }}

  selector:
    {{- include "secure-cicd-demo.selectorLabels" . | nindent 4 }}

  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      nodePort: {{ .Values.service.nodePort }}